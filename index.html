<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arcane Nature - Remastered</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="300"></canvas>

    <div id="ui-overlay">
      <div id="status-bar">
        <span class="badge">🧙‍♂️ MAGO SUPREMO</span>
        <span id="fps-display">60 FPS</span>
      </div>
    </div>

    <div id="touch-controls">
      <div class="dpad">
        <button id="btn-up" class="dpad-btn up">▲</button>
        <button id="btn-left" class="dpad-btn left">◄</button>
        <button id="btn-right" class="dpad-btn right">►</button>
        <button id="btn-down" class="dpad-btn down">▼</button>
      </div>
      <div class="action-buttons">
        <button id="btn-action" class="action-btn">✨</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
