<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ultimate Retro Boxing 360</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Aviso para Girar Tela -->
  <div id="rotate-warning">
    <div class="warning-content">
      <span>📱🔄</span>
      <h2>Gire o celular!</h2>
      <p>Jogue com a tela na horizontal (paisagem).</p>
    </div>
  </div>

  <div id="game-container">
    <!-- Menu Principal Overlay -->
    <div id="menu-overlay">
      <h1 class="game-title">ULTIMATE RETRO BOXING</h1>
      <p class="game-subtitle">Arena 360° - Canvas Responsivo</p>
      
      <div class="menu-card">
        <label for="difficulty-select">DIFICULDADE DA IA:</label>
        <select id="difficulty-select">
          <option value="easy">Fácil</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Difícil</option>
        </select>
      </div>

      <div class="menu-buttons">
        <button id="btn-start" class="menu-btn primary">🎮 INICIAR LUTA</button>
        <button id="btn-settings" class="menu-btn secondary">⚙️ CONFIGURAÇÕES</button>
      </div>
    </div>

    <!-- Configurações Overlay -->
    <div id="settings-overlay" class="hidden">
      <div class="settings-card">
        <h2>⚙️ Configurações</h2>
        <div class="setting-row">
          <span>Efeitos Sonoros 8-Bit</span>
          <input type="checkbox" id="setting-sound" checked>
        </div>
        <button id="btn-close-settings" class="menu-btn primary">Salvar e Voltar</button>
      </div>
    </div>

    <!-- Modal de Fim de Jogo -->
    <div id="msg-overlay" class="hidden">
      <h1 id="msg-title">KNOCKOUT!</h1>
      <p id="msg-subtitle">VOCÊ VENCEU!</p>
      <button id="btn-restart" class="menu-btn primary">REVANCHE 🥊</button>
    </div>

    <!-- Canvas Único Integrado -->
    <canvas id="gameCanvas"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>
